<!DOCTYPE html>
<html>
<head>
    <title>MediTrack</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 20px auto;
            padding: 0 15px;
        }

        h1 {
            color: #2a6f97;
        }
        h2 {
            margin-top: 30px;
            border-bottom: 2px solid #ddd;
            padding-bottom: 5px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: #f4f8fb;
            margin: 6px 0;
            padding: 8px 12px;
            border-radius: 6px;
        }

        input {
            padding: 6px;
            margin: 4px 4px 4px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            padding: 6px 12px;
            background: #352a97;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background: #1d5372;
        }
        .delete-btn {
            background: #c0392b;
        }

        .delete-btn:hover {
            background: #922b21;
        }
    </style>
</head>
<body>
    <h1>MediTrack — Patients</h1>
    <ul id="patient-list"></ul>
    <ul id="doctor-list"></ul>
    <ul id="appointment-list"></ul>
    <ul id="visit-list"></ul>

    <h2>Register Patient</h2>
    <input type="text" id="name-input" placeholder="Name">
    <input type="number" id="age-input" placeholder="Age">
    <button onclick="registerPatient()">Register</button>
    <h2>Register Doctor</h2>
    <input type="text" id="doctor-name-input" placeholder="Name">
    <input type="text" id="doctor-specialty-input" placeholder="Specialty">
    <button onclick="registerDoctor()">Register</button>

    <h2>Register appointment</h2>
    <input type="text" id="appt-patient-id-input" placeholder="Patient Id">
    <input type="text" id="appt-doctor-id-input" placeholder="Doctor Id">
    <input type="text" id="appt-date-input" placeholder="YYYY-MM-DD HH:MM">
    <input type="text" id="appt-reason-input" placeholder="Reason"> 
    <button onclick="registerAppointment()">Register</button>

    <h2>Register Visit</h2>
    <input type="text" id="vis-patient-id-input" placeholder="Patient Id">
    <input type="text" id="vis-date-input" placeholder="YYYY-MM-DD HH:MM">
    <input type="text" id="vis-symptoms-input" placeholder="symptoms">
    <input type="text" id="vis-diagnosis-input" placeholder="diagnosis"> 
    <input type="text" id="vis-treatment-input" placeholder="treatment">
    <input type="text" id="vis-prescription-input" placeholder="prescription">
    <input type="text" id="vis-follow-up-date-input" placeholder="YYYY-MM-DD HH:MM"> 
    <button onclick="registerVisit()">Register</button>

    <script>
        console.log("VERSION 2 LOADED");
        fetch("http://127.0.0.1:8000/patients")
            .then(response => response.json())
            .then(data => {
                const list = document.getElementById("patient-list");
        data.forEach(patient => {
            const item = document.createElement("li");
            item.textContent = `${patient.name} (age ${patient.age}) `;

            const deleteButton = document.createElement("button");
            deleteButton.textContent = "Delete";
            deleteButton.className = "delete-btn";
            deleteButton.onclick = () => deletePatient(patient.id);

            item.appendChild(deleteButton);
            list.appendChild(item);
        });
            });

        fetch("http://127.0.0.1:8000/doctors")
            .then(response => response.json())
            .then(data => {
                const list = document.getElementById("doctor-list");
        data.forEach(doctor => {
            const item = document.createElement("li");
            item.textContent = `${doctor.name} (specialty ${doctor.specialty}) `;

            const deleteButton = document.createElement("button");
            deleteButton.textContent = "Delete";
            deleteButton.className = "delete-btn";
            deleteButton.onclick = () => deleteDoctor(doctor.id);

            item.appendChild(deleteButton);
            list.appendChild(item);
        });
            });

                fetch("http://127.0.0.1:8000/appointments")
            .then(response => response.json())
            .then(data => {
                const list = document.getElementById("appointment-list");
        data.forEach(appointment => {
            const item = document.createElement("li");
            item.textContent = `${appointment.patient_name} with Dr. ${appointment.doctor_name} on ${appointment.appointment_date} — ${appointment.reason} `;                const deleteButton = document.createElement("button");
            deleteButton.textContent = "Delete";
            deleteButton.className = "delete-btn";
            deleteButton.onclick = () => deleteAppointment(appointment.id);

            item.appendChild(deleteButton);
            list.appendChild(item);
        });
            });

                fetch("http://127.0.0.1:8000/visits")
            .then(response => response.json())
            .then(data => {
                const list = document.getElementById("visit-list");
        data.forEach(visit => {
            const item = document.createElement("li");
            item.textContent = `${visit.patient_name} — ${visit.visit_date}: ${visit.symptoms}, ${visit.diagnosis}, ${visit.treatment}, ${visit.prescription} (follow-up: ${visit.follow_up_date}) `;

            const deleteButton = document.createElement("button");
            deleteButton.textContent = "Delete";
            deleteButton.className = "delete-btn";
            deleteButton.onclick = () => deleteVisit(visit.id);

            item.appendChild(deleteButton);
            list.appendChild(item);
        });
            });        
        
        function registerPatient() {
            const name = document.getElementById("name-input").value;
            const age = document.getElementById("age-input").value;

            fetch("http://127.0.0.1:8000/patients", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name: name, age: parseInt(age) })
            })
            .then(response => response.json())
            .then(data => {
                console.log(data);
                location.reload();
            });
        }

        
        function deletePatient(patientId) {
            fetch(`http://127.0.0.1:8000/patients/${patientId}`, {
                method: "DELETE"
            })
            .then(response => response.json())
            .then(data => {
                console.log(data);
                location.reload();
            });
        }

        function registerDoctor() {
            const name = document.getElementById("doctor-name-input").value;
            const specialty = document.getElementById("doctor-specialty-input").value;

            fetch("http://127.0.0.1:8000/doctors", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name: name, specialty: specialty })
            })
            .then(response => response.json())
            .then(data => {
                console.log(data);
                location.reload();
            });
        }

        function deleteDoctor(doctorId) {
            fetch(`http://127.0.0.1:8000/doctors/${doctorId}`, {
                method: "DELETE"
            })
            .then(response => response.json())
            .then(data => {
                console.log(data);
                location.reload();
            });
        }

        function registerAppointment() {
            console.log("appointment button clicked");
            const patientId = document.getElementById("appt-patient-id-input").value;
            const doctorId = document.getElementById("appt-doctor-id-input").value;
            const date = document.getElementById("appt-date-input").value;
            const reason = document.getElementById("appt-reason-input").value;

            fetch("http://127.0.0.1:8000/appointments", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    patient_id: parseInt(patientId),
                    doctor_id: parseInt(doctorId),
                    appointment_date: date,
                    reason: reason
                })
            })
            .then(response => response.json())
            .then(data => {
                console.log(data);
                location.reload();
            });
        }

        function deleteAppointment(appointmentId) {
            fetch(`http://127.0.0.1:8000/appointments/${appointmentId}`, {
                method: "DELETE"
            })
            .then(response => response.json())
            .then(data => {
                console.log(data);
                location.reload();
            });
        }

        function registerVisit() {
            console.log("visit button clicked");
            const patientId = document.getElementById("vis-patient-id-input").value;
            const visitdate = document.getElementById("vis-date-input").value;
            const symptoms = document.getElementById("vis-symptoms-input").value;
            const diagnosis = document.getElementById("vis-diagnosis-input").value;
            const treatment = document.getElementById("vis-treatment-input").value;
            const prescription = document.getElementById("vis-prescription-input").value;
            const followupdate = document.getElementById("vis-follow-up-date-input").value;

            fetch("http://127.0.0.1:8000/visits", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ patient_id: parseInt(patientId), visit_date: visitdate, symptoms: symptoms, diagnosis: diagnosis, treatment: treatment, prescription: prescription, follow_up_date: followupdate })
            })
            .then(response => response.json())
            .then(data => {
                console.log(data);
                location.reload();
            });
        }

        function deleteVisit(visitId) {
            fetch(`http://127.0.0.1:8000/visits/${visitId}`, {
                method: "DELETE"
            })
            .then(response => response.json())
            .then(data => {
                console.log(data);
                location.reload();
            });
        }

    </script>
</body>
</html>
